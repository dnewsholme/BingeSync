[package]
name = "bingesync"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1.54", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "compression-gzip", "compression-br", "compression-zstd"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-unbundled", "chrono", "uuid", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.8"
rust-embed = "8.13"
mime_guess = "2.0"
multer = "3.1"
tokio-util = { version = "0.7", features = ["io"] }
time = "0.3"
base64 = "0.23"
url = "2.5"
sha2 = "0.10"
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

